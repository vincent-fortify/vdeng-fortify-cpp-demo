name: Fortify SAST (C/C++ via MBS)

# C/C++ cannot be uploaded to FoD as source. The job translates the code with
# sourceanalyzer (wrapping the normal build), exports a Mobile Build Session (MBS),
# then the Fortify GitHub Action submits it to FoD, waits and publishes to code scanning.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read          # pull the private SAST image from GHCR
  security-events: write  # upload SARIF to code scanning

env:
  BUILD_ID: ${{ github.event.repository.name }}
  FOD_URL: ${{ vars.FOD_URL }}
  FOD_RELEASE: ${{ vars.FOD_RELEASE }}   # "<application>:<release>", static scan setup = MBS/C/C++/Scala

jobs:
  fortify-sast:
    # Skips cleanly until the repo variables are configured
    if: ${{ vars.FOD_RELEASE != '' }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vincent-fortify/fortify-sast-cpp:26.3.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Fortify licence
        env:
          FORTIFY_LICENSE_B64: ${{ secrets.FORTIFY_LICENSE_B64 }}
        run: echo "$FORTIFY_LICENSE_B64" | base64 -d > "$FORTIFY_HOME/fortify.license"

      - name: Translate (touchless build)
        run: |
          make clean
          sourceanalyzer -b "$BUILD_ID" -clean
          sourceanalyzer -debug -verbose -logfile translate.log -b "$BUILD_ID" touchless make
          sourceanalyzer -b "$BUILD_ID" -show-files | tee translated-files.txt
          if [ ! -s translated-files.txt ]; then
            echo "::error::No files were translated. Check translate.log and that the build compiles."
            exit 1
          fi

      - name: Export Mobile Build Session
        run: |
          sourceanalyzer -b "$BUILD_ID" -Dcom.fortify.sca.MobileBuildSessions=true -export-build-session fortify.mbs
          zip -j fortify-mbs.zip fortify.mbs
          unzip -l fortify-mbs.zip
          # Absolute container path: the Fortify action resolves relative paths against its own data dir
          echo "MBS_PACKAGE=$PWD/fortify-mbs.zip" >> "$GITHUB_ENV"

      - name: Keep translation artefacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: fortify-translation
          path: |
            translate.log
            translated-files.txt
            fortify-mbs.zip
          if-no-files-found: ignore

      # Official Fortify action. USE_PACKAGE skips ScanCentral source packaging (which
      # cannot handle C/C++) and submits the pre-translated MBS instead. The action then
      # waits for the scan and publishes results to GitHub code scanning.
      - name: Fortify on Demand SAST (pre-translated MBS)
        uses: fortify/github-action@v3
        env:
          FOD_URL: ${{ vars.FOD_URL }}
          FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
          FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
          FOD_RELEASE: ${{ vars.FOD_RELEASE }}
          USE_PACKAGE: ${{ env.MBS_PACKAGE }}
          DO_WAIT: true
          DO_CHECK_POLICY: false
